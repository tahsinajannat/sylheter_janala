        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin / Taxonomy]
      summary: Delete a tag
      description: 'Roles: editor, admin. Removed from all posts / photo cards.'
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Admin: comments ─────────────────────────
  /admin/comments:
    get:
      tags: [Admin / Comments]
      summary: Moderation queue
      description: 'Roles: editor, admin. Defaults to `pending`, oldest first.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CommentStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminComment' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/comments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin / Comments]
      summary: Approve / reject / mark spam
      description: 'Roles: editor, admin.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { $ref: '#/components/schemas/CommentStatus' } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { $ref: '#/components/schemas/CommentStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin / Comments]
      summary: Delete a comment (and its replies)
      description: 'Roles: editor, admin.'
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Admin: subscribers & newsletters ─────────────────────────
  /admin/subscribers:
    get:
      tags: [Admin / Subscribers]
      summary: List subscribers
      description: 'Roles: editor, admin. `meta.summary` has the count per status over all subscribers.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SubscriberStatus' } }
        - { name: lang, in: query, schema: { $ref: '#/components/schemas/Lang' } }
        - { name: q, in: query, description: Email contains, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of subscribers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Subscriber' } }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        properties:
                          summary:
                            type: object
                            additionalProperties: { type: integer }
                            example: { active: 120, pending: 4, unsubscribed: 9, bounced: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/subscribers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [Admin / Subscribers]
      summary: Permanently delete a subscriber
      description: 'Roles: editor, admin. For data-removal requests.'
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/newsletters:
    get:
      tags: [Admin / Newsletters]
      summary: List campaigns with delivery stats
      description: 'Roles: editor, admin.'
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin / Newsletters]
      summary: Create a draft campaign
      description: 'Roles: editor, admin. `bodyHtml` is sanitised. The unsubscribe footer and headers are added automatically.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lang, subject, bodyHtml]
              properties:
                lang: { $ref: '#/components/schemas/Lang' }
                subject: { type: string, minLength: 3, maxLength: 200 }
                bodyHtml: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Campaign' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/newsletters/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin / Newsletters]
      summary: One campaign, with delivery stats
      description: 'Roles: editor, admin.'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Campaign' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin / Newsletters]
      summary: Edit a draft campaign
      description: 'Roles: editor, admin. `409` once it is no longer a draft.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string, minLength: 3, maxLength: 200 }
                bodyHtml: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Campaign' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin / Newsletters]
      summary: Delete a draft campaign
      description: 'Roles: editor, admin. Only drafts can be deleted.'
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/newsletters/{id}/test:
    post:
      tags: [Admin / Newsletters]
      summary: Send a test email
      description: 'Roles: editor, admin. The unsubscribe link in a test is not live.'
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '202':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { sent: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/newsletters/{id}/send:
    post:
      tags: [Admin / Newsletters]
      summary: Send the campaign
      description: |
        Roles: editor, admin. Queues one delivery per **active** subscriber in the campaign's language and marks the
        campaign `sending`. A background worker sends in batches of 20 every 15 s, survives restarts, and skips anyone
        who unsubscribed meanwhile. `400` when there are no recipients; `409` if it was already sent.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, example: sending }
                      recipients: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── Admin: users & settings ─────────────────────────
  /admin/users:
    get:
      tags: [Admin / Users]
      summary: List staff accounts
      description: 'Roles: admin.'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Staff accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StaffUser' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin / Users]
      summary: Create a staff account
      description: 'Roles: admin. Role defaults to `author`.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                role: { $ref: '#/components/schemas/StaffRole' }
                bio: { type: string, maxLength: 500, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/StaffUser' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin / Users]
      summary: Update a staff account
      description: 'Roles: admin. Deactivating an account (`isActive: false`) invalidates its tokens immediately. An admin cannot demote or deactivate themselves.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                role: { $ref: '#/components/schemas/StaffRole' }
                bio: { type: string, maxLength: 500, nullable: true }
                isActive: { type: boolean }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/StaffUser' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/settings:
    get:
      tags: [Admin / Settings]
      summary: All site settings
      description: 'Roles: admin.'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Setting' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/{key}:
    put:
      tags: [Admin / Settings]
      summary: Create or update a setting
      description: 'Roles: admin. Keys are lowercase letters, digits and underscores. Keys `bn_portal_url`, `en_portal_url`, `site_*` and `social_*` are exposed publicly by `GET /settings`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9_]{2,64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties: { value: { type: string, maxLength: 2000 } }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Setting' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `POST /auth/login` (staff) or `POST /auth/reader/login` (reader).

  parameters:
    Lang:
      name: lang
      in: query
      required: true
      description: Content language
      schema: { $ref: '#/components/schemas/Lang' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      description: URL slug (may contain Bangla; URL-encode)
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              message: Validation failed
              details: [{ path: lang, message: 'Invalid option: expected one of "bn"|"en"' }]
    Unauthorized:
      description: Missing, invalid or expired token (or wrong credentials)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but this account type or role may not do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicts with existing data (duplicate slug / email, record in use, wrong state)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until you may retry }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ── primitives ──
    Lang: { type: string, enum: [bn, en] }
    ContentStatus: { type: string, enum: [draft, scheduled, published, archived] }
    CommentStatus: { type: string, enum: [pending, approved, rejected, spam] }
    SubscriberStatus: { type: string, enum: [pending, active, unsubscribed, bounced] }
    StaffRole: { type: string, enum: [admin, editor, author] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
            details: {}
    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Image:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string, format: uri }
        alt: { type: string, nullable: true }
        width: { type: integer }
        height: { type: integer }
    NamedRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    # ── public content ──
    PostCard:
      type: object
      required: [id, lang, type, slug, title, publishedAt, viewCount, category, author]
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        type: { type: string, enum: [news, editorial] }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time }
        viewCount: { type: integer }
        readMinutes: { type: integer, nullable: true }
        category: { $ref: '#/components/schemas/NamedRef' }
        author: { type: object, required: [name], properties: { name: { type: string } } }
        image:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Image' }]
    SpotlightPost:
      allOf:
        - $ref: '#/components/schemas/PostCard'
        - type: object
          required: [position]
          properties:
            position: { type: integer, minimum: 1, maximum: 4, description: Slot in the spotlight section }
    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostCard'
        - type: object
          required: [content, shareCount, seo, tags, translations, related, popular]
          properties:
            content: { type: string, description: Sanitised HTML }
            imageCaption: { type: string, nullable: true }
            shareCount: { type: integer }
            seo:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string, nullable: true }
            tags: { type: array, items: { $ref: '#/components/schemas/NamedRef' } }
            translations:
              type: array
              description: The same story in other languages, for the language switcher
              items:
                type: object
                required: [lang, slug]
                properties:
                  lang: { $ref: '#/components/schemas/Lang' }
                  slug: { type: string }
            related: { type: array, items: { $ref: '#/components/schemas/PostCard' } }
            popular: { type: array, items: { $ref: '#/components/schemas/PostCard' } }
    PhotoCard:
      type: object
      required: [id, lang, slug, title, publishedAt, viewCount, image]
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        slug: { type: string }
        title: { type: string }
        caption: { type: string, nullable: true }
        photographer: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time }
        viewCount: { type: integer }
        category:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/NamedRef' }]
        image: { $ref: '#/components/schemas/Image' }
    PhotoCardDetail:
      allOf:
        - $ref: '#/components/schemas/PhotoCard'
        - type: object
          required: [tags, related]
          properties:
            tags: { type: array, items: { $ref: '#/components/schemas/NamedRef' } }
            related: { type: array, items: { $ref: '#/components/schemas/PhotoCard' } }
    Video:
      type: object
      required: [id, lang, slug, title, youtubeId, youtubeUrl, embedUrl, thumbnail, isFeatured, publishedAt, viewCount]
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        slug: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        youtubeId: { type: string, example: dQw4w9WgXcQ }
        youtubeUrl: { type: string, format: uri }
        embedUrl: { type: string, format: uri, description: Privacy-enhanced (youtube-nocookie) embed URL }
        thumbnail: { type: string, format: uri, description: 'Custom thumbnail, otherwise the YouTube one' }
        isFeatured: { type: boolean }
        publishedAt: { type: string, format: date-time }
        viewCount: { type: integer }
        category:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/NamedRef' }]
    VideoDetail:
      allOf:
        - $ref: '#/components/schemas/Video'
        - type: object
          required: [related]
          properties:
            related: { type: array, items: { $ref: '#/components/schemas/Video' } }
    AdKind: { type: string, enum: [banner, adsense] }
    AdPlacement: { type: string, enum: [home_mid, home_sidebar, article_inline, article_bottom, listing_top] }
    Ad:
      type: object
      required: [id, kind, placement, alt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AdKind' }
        placement: { $ref: '#/components/schemas/AdPlacement' }
        imageUrl: { type: string, format: uri, nullable: true }
        imageWidth: { type: integer, nullable: true }
        imageHeight: { type: integer, nullable: true }
        linkUrl: { type: string, format: uri, nullable: true }
        alt: { type: string }
        adsenseSlot: { type: string, nullable: true }
        adsenseClient: { type: string, nullable: true, description: 'AdSense publisher id (ca-pub-…); set on AdSense ads only' }
    AdminAd:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/AdKind' }
        placement: { $ref: '#/components/schemas/AdPlacement' }
        lang: { allOf: [{ $ref: '#/components/schemas/Lang' }], nullable: true, description: 'null = both portals' }
        imageId: { type: string, format: uuid, nullable: true }
        imageUrl: { type: string, format: uri, nullable: true }
        linkUrl: { type: string, format: uri, nullable: true }
        altText: { type: string, nullable: true }
        adsenseSlot: { type: string, nullable: true }
        isActive: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        impressions: { type: integer }
        clicks: { type: integer }
        updatedAt: { type: string, format: date-time }
    AdInput:
      type: object
      required: [name, kind, placement]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        kind: { $ref: '#/components/schemas/AdKind' }
        placement: { $ref: '#/components/schemas/AdPlacement' }
        lang: { allOf: [{ $ref: '#/components/schemas/Lang' }], nullable: true }
        imageId: { type: string, format: uuid, nullable: true }
        linkUrl: { type: string, format: uri, nullable: true }
        altText: { type: string, maxLength: 250, nullable: true }
        adsenseSlot: { type: string, pattern: '^\d{4,20}$', nullable: true }
        isActive: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
    Category:
      type: object
      required: [id, slug, name, sortOrder, showInNav]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        showInNav: { type: boolean }
        translationKey: { type: string, format: uuid, nullable: true }
    TagWithCount:
      type: object
      required: [slug, name, posts]
      properties:
        slug: { type: string }
        name: { type: string }
        posts: { type: integer }
    Comment:
      type: object
      required: [id, body, createdAt, author]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        author:
          type: object
          required: [name]
          properties:
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
    HomePayload:
      type: object
      required: [lang, spotlight, featured, latest, otherLanguage, photoCards, editorials, videos]
      properties:
        lang: { $ref: '#/components/schemas/Lang' }
        hero:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/PostCard' }]
        spotlight: { type: array, items: { $ref: '#/components/schemas/SpotlightPost' } }
        featured: { type: array, items: { $ref: '#/components/schemas/PostCard' } }
        latest: { type: array, items: { $ref: '#/components/schemas/PostCard' } }
        otherLanguage:
          type: object
          required: [lang, posts]
          properties:
            lang: { $ref: '#/components/schemas/Lang' }
            portalUrl: { type: string, nullable: true, description: 'Base URL of the other language portal (`<portalUrl>/news/<slug>` is a post)' }
            posts: { type: array, items: { $ref: '#/components/schemas/PostCard' } }
        photoCards: { type: array, items: { $ref: '#/components/schemas/PhotoCard' } }
        editorials: { type: array, items: { $ref: '#/components/schemas/PostCard' } }
        videos: { type: array, items: { $ref: '#/components/schemas/Video' } }

    # ── accounts ──
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 72 }
    StaffUserBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/StaffRole' }
    ReaderSession:
      type: object
      properties:
        data:
          type: object
          required: [token, reader]
          properties:
            token: { type: string }
            reader:
              type: object
              required: [id, name, email, preferredLang]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                email: { type: string, format: email }
                preferredLang: { $ref: '#/components/schemas/Lang' }
    Me:
      type: object
      required: [id, name, email, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        kind: { type: string, enum: [staff, reader] }
        role: { $ref: '#/components/schemas/StaffRole' }

    # ── admin ──
    PostInput:
      type: object
      required: [lang, title, content, categoryId]
      properties: &postFields
        lang: { $ref: '#/components/schemas/Lang' }
        type: { type: string, enum: [news, editorial], default: news }
        title: { type: string, minLength: 3, maxLength: 300 }
        slug: { type: string, maxLength: 120, description: Optional. Generated from the title when omitted }
        excerpt: { type: string, maxLength: 600, nullable: true }
        content: { type: string, maxLength: 200000, description: HTML. Sanitised on save }
        status: { $ref: '#/components/schemas/ContentStatus' }
        featuredImageId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid }
        isHero: { type: boolean }
        isSpotlight: { type: boolean }
        spotlightOrder: { type: integer, minimum: 0, maximum: 1000 }
        isFeatured: { type: boolean }
        featuredOrder: { type: integer, minimum: 0, maximum: 1000 }
        translationKey: { type: string, format: uuid, nullable: true }
        metaTitle: { type: string, maxLength: 200, nullable: true }
        metaDescription: { type: string, maxLength: 400, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        tagIds: { type: array, items: { type: string, format: uuid }, maxItems: 20 }
    PostUpdate:
      type: object
      description: Same fields as PostInput except `lang`; all optional
      properties:
        type: { type: string, enum: [news, editorial] }
        title: { type: string, minLength: 3, maxLength: 300 }
        slug: { type: string, maxLength: 120 }
        excerpt: { type: string, maxLength: 600, nullable: true }
        content: { type: string, maxLength: 200000 }
        status: { $ref: '#/components/schemas/ContentStatus' }
        featuredImageId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid }
        isHero: { type: boolean }
        isSpotlight: { type: boolean }
        spotlightOrder: { type: integer, minimum: 0, maximum: 1000 }
        isFeatured: { type: boolean }
        featuredOrder: { type: integer, minimum: 0, maximum: 1000 }
        translationKey: { type: string, format: uuid, nullable: true }
        metaTitle: { type: string, maxLength: 200, nullable: true }
        metaDescription: { type: string, maxLength: 400, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        tagIds: { type: array, items: { type: string, format: uuid }, maxItems: 20 }
    AdminPostSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        type: { type: string, enum: [news, editorial] }
        slug: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ContentStatus' }
        publishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        viewCount: { type: integer }
        isHero: { type: boolean }
        isSpotlight: { type: boolean }
        isFeatured: { type: boolean }
        categoryName: { type: string }
        authorName: { type: string }
    AdminPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        type: { type: string, enum: [news, editorial] }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        content: { type: string }
        status: { $ref: '#/components/schemas/ContentStatus' }
        featuredImageId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        isHero: { type: boolean }
        isSpotlight: { type: boolean }
        spotlightOrder: { type: integer }
        isFeatured: { type: boolean }
        featuredOrder: { type: integer }
        translationKey: { type: string, format: uuid, nullable: true }
        viewCount: { type: integer }
        shareCount: { type: integer }
        readMinutes: { type: integer, nullable: true }
        metaTitle: { type: string, nullable: true }
        metaDescription: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        tagIds: { type: array, items: { type: string, format: uuid } }
    PhotoCardInput:
      type: object
      required: [lang, title, imageId]
      properties:
        lang: { $ref: '#/components/schemas/Lang' }
        title: { type: string, minLength: 2, maxLength: 200 }
        slug: { type: string, maxLength: 120 }
        caption: { type: string, maxLength: 1000, nullable: true }
        photographer: { type: string, maxLength: 120, nullable: true }
        status: { $ref: '#/components/schemas/ContentStatus' }
        imageId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        isSlider: { type: boolean, default: true }
        sliderOrder: { type: integer, minimum: 0, maximum: 1000 }
        publishedAt: { type: string, format: date-time, nullable: true }
        tagIds: { type: array, items: { type: string, format: uuid }, maxItems: 20 }
    PhotoCardUpdate:
      type: object
      description: Same fields as PhotoCardInput except `lang`; all optional
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        slug: { type: string, maxLength: 120 }
        caption: { type: string, maxLength: 1000, nullable: true }
        photographer: { type: string, maxLength: 120, nullable: true }
        status: { $ref: '#/components/schemas/ContentStatus' }
        imageId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        isSlider: { type: boolean }
        sliderOrder: { type: integer, minimum: 0, maximum: 1000 }
        publishedAt: { type: string, format: date-time, nullable: true }
        tagIds: { type: array, items: { type: string, format: uuid }, maxItems: 20 }
    AdminPhotoCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        slug: { type: string }
        title: { type: string }
        caption: { type: string, nullable: true }
        photographer: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ContentStatus' }
        imageId: { type: string, format: uuid }
        imageUrl: { type: string, format: uri }
        categoryId: { type: string, format: uuid, nullable: true }
        isSlider: { type: boolean }
        sliderOrder: { type: integer }
        viewCount: { type: integer }
        publishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        tagIds: { type: array, items: { type: string, format: uuid } }
    VideoInput:
      type: object
      required: [lang, title, youtubeUrl]
      properties:
        lang: { $ref: '#/components/schemas/Lang' }
        title: { type: string, minLength: 2, maxLength: 250 }
        slug: { type: string, maxLength: 120 }
