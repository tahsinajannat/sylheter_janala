        publishedAt: { type: string, format: date-time, nullable: true }
    VideoUpdate:
      type: object
      description: Same fields as VideoInput except `lang`; all optional
      properties:
        title: { type: string, minLength: 2, maxLength: 250 }
        slug: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 5000, nullable: true }
        youtubeUrl: { type: string, format: uri }
        status: { $ref: '#/components/schemas/ContentStatus' }
        thumbnailId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        isFeatured: { type: boolean }
        publishedAt: { type: string, format: date-time, nullable: true }
    AdminVideo:
      type: object
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        slug: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        youtubeUrl: { type: string, format: uri }
        youtubeId: { type: string }
        status: { $ref: '#/components/schemas/ContentStatus' }
        thumbnailId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        isFeatured: { type: boolean }
        viewCount: { type: integer }
        publishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer, maximum: 10485759 }
        format: { type: string, example: jpg }
        alt: { type: string, nullable: true }
        caption: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CategoryInput:
      type: object
      required: [lang, name]
      properties:
        lang: { $ref: '#/components/schemas/Lang' }
        name: { type: string, minLength: 2, maxLength: 80 }
        slug: { type: string, maxLength: 80 }
        sortOrder: { type: integer, minimum: 0, maximum: 1000 }
        showInNav: { type: boolean }
        translationKey: { type: string, format: uuid, nullable: true }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        slug: { type: string, maxLength: 80 }
        sortOrder: { type: integer, minimum: 0, maximum: 1000 }
        showInNav: { type: boolean }
        translationKey: { type: string, format: uuid, nullable: true }
    AdminCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        slug: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        showInNav: { type: boolean }
        translationKey: { type: string, format: uuid, nullable: true }
        posts: { type: integer, description: Number of posts in the category (all statuses); only on list }
    AdminTag:
      type: object
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        slug: { type: string }
        name: { type: string }
    AdminComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        status: { $ref: '#/components/schemas/CommentStatus' }
        parentId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        post:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            lang: { $ref: '#/components/schemas/Lang' }
        reader:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
    Subscriber:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        lang: { $ref: '#/components/schemas/Lang' }
        status: { $ref: '#/components/schemas/SubscriberStatus' }
        source: { type: string, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        unsubscribedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        lang: { $ref: '#/components/schemas/Lang' }
        subject: { type: string }
        bodyHtml: { type: string }
        status: { type: string, enum: [draft, sending, sent, failed] }
        sentAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        stats:
          type: object
          description: Deliveries per status (list endpoint only)
          additionalProperties: { type: integer }
          example: { sent: 118, failed: 1, skipped: 2 }
    StaffUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/StaffRole' }
        bio: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    Setting:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
        updatedAt: { type: string, format: date-time }
