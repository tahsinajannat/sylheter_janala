openapi: 3.0.3
info:
  title: Sylheter Janala API
  version: 1.0.0
  description: |
    REST API for **সিলেটের জানালা (Sylheter Janala)**, a bilingual (Bangla / English) news portal.

    ## Conventions

    * **Envelope.** Success: `{ "data": …, "meta": … }` (`meta` only on paged lists). Error: `{ "error": { "message", "details?" } }`.
    * **Language.** Content is stored per language (`bn` / `en`). Every public read takes a required `lang` query parameter.
    * **Published only.** Public endpoints return only content whose status is `published` and whose `publishedAt` is in the past. Drafts and scheduled items are visible only through `/admin`.
    * **Paging.** `page` (from 1) and `limit` (1–50, default 12). Responses include `meta: { page, limit, total, totalPages }`.
    * **Slugs.** Slugs are unique per language and may contain Bangla letters. URL-encode them in paths.
    * **IDs** are UUIDs.

    ## Authentication

    Send `Authorization: Bearer <token>`. There are two kinds of accounts, with separate login endpoints:

    | Kind | Login | Used for |
    |---|---|---|
    | **staff** (`admin`, `editor`, `author`) | `POST /auth/login` | everything under `/admin` |
    | **reader** (public visitor) | `POST /auth/reader/login` | comments, bookmarks |

    A staff token cannot call reader endpoints and vice versa (403). Tokens are checked against the database on every request, so disabling an account takes effect immediately.

    ## Staff roles

    | Role | Can |
    |---|---|
    | `author` | create / edit **own drafts**; upload images; create tags. Cannot publish, schedule, or use hero / spotlight / featured placement |
    | `editor` | everything content: publish & schedule, placement, categories, comment moderation, subscribers, newsletters |
    | `admin` | everything, plus staff accounts and site settings |

    Each admin operation lists the roles that may call it.

    ## Rate limits

    Login / register: 20 per 15 min per IP. Subscribe / confirm: 10 per hour. Counters: 120 per min. Comments: 20 per min. Everything else: 300 per min. Exceeded limits return `429` with `RateLimit` / `Retry-After` headers.
  license:
    name: Proprietary
servers:
  - url: /api
    description: This server
tags:
  - name: Home
    description: The home page in one call
  - name: Posts
    description: News articles and editorials
  - name: Photo cards
    description: Photo slider and photo pages
  - name: Videos
    description: YouTube video news
  - name: Ads
    description: Banner and AdSense ads shown on the public site
  - name: Taxonomy
    description: Categories, tags and public site settings
  - name: Newsletter
    description: Email subscription (double opt-in)
  - name: Accounts
    description: Staff and reader sign-in
  - name: Reader
    description: Bookmarks (reader account required)
  - name: Webhooks
    description: Email provider callbacks
  - name: Admin / Posts
  - name: Admin / Photo cards
  - name: Admin / Videos
  - name: Admin / Ads
    description: Manage ads (editor, admin)
  - name: Admin / Media
  - name: Admin / Taxonomy
  - name: Admin / Comments
  - name: Admin / Subscribers
  - name: Admin / Newsletters
  - name: Admin / Users
  - name: Admin / Settings
  - name: System

paths:
  /health:
    servers:
      - url: /
    get:
      tags: [System]
      summary: Health check
      description: Checks the database connection. Not under `/api`, not rate limited. Used by Docker health checks.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: unavailable } } }

  # ───────────────────────── Public ─────────────────────────
  /home:
    get:
      tags: [Home]
      summary: Everything the home page needs
      description: |
        One call for all home sections.

        * `spotlight` – up to 4 posts; `position` (1–4) lets the frontend vary the card layout per slot.
        * `otherLanguage` – latest posts of the *other* language plus that language portal's URL.
        * `hero` falls back to the latest post when none is flagged.
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200':
          description: Home payload
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/HomePayload' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /posts:
    get:
      tags: [Posts]
      summary: List / search posts
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: type, in: query, schema: { type: string, enum: [news, editorial], default: news } }
        - { name: category, in: query, description: Category slug, schema: { type: string } }
        - { name: tag, in: query, description: Tag slug, schema: { type: string } }
        - { name: q, in: query, description: 'Search in title and excerpt (2–100 chars). Works for Bangla.', schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: exclude, in: query, description: Post id to leave out, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of posts
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PostCard' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /posts/popular:
    get:
      tags: [Posts]
      summary: Most popular posts
      description: Ranked by views in the window (`day` = today, `week` = last 7 days, `month` = last 30 days, in the site time zone). On a quiet site the list is topped up with all-time most viewed.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: range, in: query, schema: { type: string, enum: [day, week, month], default: week } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200':
          description: Popular posts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/PostCard' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /posts/{slug}:
    get:
      tags: [Posts]
      summary: Single post (article page)
      description: Article with content, tags, language-switcher links, related posts (same category / shared tags) and this week's popular posts.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/PostDetail' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /posts/{id}/view:
    post:
      tags: [Posts]
      summary: Count a view
      description: Call once per visit (the frontend de-duplicates per session). Updates the post total and today's counter used by "most popular".
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Counted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /posts/{id}/share:
    post:
      tags: [Posts]
      summary: Count a share
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: New share total
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { shareCount: { type: integer } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /posts/{id}/comments:
    get:
      tags: [Posts]
      summary: Approved comments of a post
      description: Flat list, oldest first (max 300). Use `parentId` to nest replies.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Posts]
      summary: Add a comment (reader)
      description: Requires a **reader** token. The comment is stored as `pending` and shown only after an editor approves it.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                parentId: { type: string, format: uuid, description: Id of an approved comment on the same post }
      responses:
        '201':
          description: Accepted, awaiting moderation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, example: pending }
                      message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /photo-cards:
    get:
      tags: [Photo cards]
      summary: List photo cards
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: slider, in: query, description: 'Pass `true` for the home slider only (ordered by slider position)', schema: { type: string, enum: ['true'] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of photo cards
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PhotoCard' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /photo-cards/{slug}:
    get:
      tags: [Photo cards]
      summary: Photo card page
      description: The card plus up to 8 related cards (same category, shared tags, then newest).
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The photo card
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/PhotoCardDetail' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /photo-cards/{id}/view:
    post:
      tags: [Photo cards]
      summary: Count a view
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Counted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /videos:
    get:
      tags: [Videos]
      summary: List videos
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of videos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Video' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /videos/{slug}:
    get:
      tags: [Videos]
      summary: Video page
      description: The video plus up to 8 related videos (same category first, then newest).
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The video
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/VideoDetail' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /videos/{id}/view:
    post:
      tags: [Videos]
      summary: Count a view
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Counted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /ads:
    get:
      tags: [Ads]
      summary: Ads that can be shown now
      description: Active ads inside their date window for this language (ads without a language are included). Banners without an image are left out, and AdSense ads are left out until the publisher id is set. Never cached, so schedules apply to the second. The site picks one ad per placement.
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200':
          description: Live ads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Ad' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /ads/{id}/impression:
    post:
      tags: [Ads]
      summary: Count an impression
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Counted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /ads/{id}/click:
    post:
      tags: [Ads]
      summary: Count a click
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Counted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /categories:
    get:
      tags: [Taxonomy]
      summary: Categories of a language (navbar)
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200':
          description: Categories ordered for the navbar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /tags:
    get:
      tags: [Taxonomy]
      summary: Tags with published post counts
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200':
          description: Up to 60 tags, most used first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TagWithCount' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /settings:
    get:
      tags: [Taxonomy]
      summary: Public site settings
      description: 'Only keys safe for the public site: `bn_portal_url`, `en_portal_url`, `site_*`, `social_*`.'
      responses:
        '200':
          description: Key / value map
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: { type: string } }

  /subscribers:
    post:
      tags: [Newsletter]
      summary: Subscribe (starts double opt-in)
      description: |
        Creates a `pending` subscriber and emails a confirmation link (valid 48 h).
        The reply is identical whether or not the address is already subscribed (no account enumeration).
        Re-sending is throttled to once per minute per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                lang: { $ref: '#/components/schemas/Lang' }
                source: { type: string, maxLength: 40, description: 'Where the form was, e.g. `footer`' }
      responses:
        '202':
          description: Confirmation email sent (or already subscribed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: pending }
                      message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: The confirmation email could not be sent; retry shortly, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /subscribers/confirm:
    post:
      tags: [Newsletter]
      summary: Confirm a subscription
      description: Called by the frontend page the email link points to. It is a POST on purpose, because mail scanners prefetch GET links. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string, minLength: 16, maxLength: 128 } }
      responses:
        '200':
          description: Subscription is active
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: active }
                      lang: { $ref: '#/components/schemas/Lang' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { description: Link invalid or expired, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /subscribers/unsubscribe:
    post:
      tags: [Newsletter]
      summary: Unsubscribe
      description: |
        Token comes from the link in every newsletter. Accepts the token in a JSON body **or** as `?token=`,
        and also a `application/x-www-form-urlencoded` body, so it doubles as the RFC 8058 *one-click* endpoint
        referenced by the `List-Unsubscribe-Post` header. Idempotent.
      parameters:
        - { name: token, in: query, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { token: { type: string } } }
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { List-Unsubscribe: { type: string, example: One-Click } } }
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: unsubscribed }
                      lang: { $ref: '#/components/schemas/Lang' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/email:
    post:
      tags: [Webhooks]
      summary: Email provider event (bounce / complaint)
      description: |
        Provider-neutral. Point your provider's webhook at a small adapter that maps to this body.
        Send `bounce` for **hard** bounces only. `bounce` → subscriber becomes `bounced`; `complaint` → `unsubscribed`.
        Disabled (404) unless `EMAIL_WEBHOOK_SECRET` is set.
      parameters:
        - { name: x-webhook-secret, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, email]
              properties:
                event: { type: string, enum: [bounce, complaint] }
                email: { type: string, format: email }
      responses:
        '204': { description: Processed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Accounts ─────────────────────────
  /auth/login:
    post:
      tags: [Accounts]
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/StaffUserBrief' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reader/register:
    post:
      tags: [Accounts]
      summary: Create a reader account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                preferredLang: { $ref: '#/components/schemas/Lang' }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReaderSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reader/login:
    post:
      tags: [Accounts]
      summary: Reader login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReaderSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Accounts]
      summary: Who am I
      description: Works with a staff or a reader token.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The signed-in account
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Me' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bookmarks:
    get:
      tags: [Reader]
      summary: My bookmarked posts
      description: Requires a **reader** token.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PostCard' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /bookmarks/{postId}:
    put:
      tags: [Reader]
      summary: Bookmark a post (idempotent)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: postId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Bookmarked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reader]
      summary: Remove a bookmark
      security: [{ bearerAuth: [] }]
      parameters: [{ name: postId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── Admin: posts ─────────────────────────
  /admin/posts:
    get:
      tags: [Admin / Posts]
      summary: List posts (all statuses)
      description: 'Roles: **author** (own posts only), editor, admin.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lang, in: query, schema: { $ref: '#/components/schemas/Lang' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContentStatus' } }
        - { name: type, in: query, schema: { type: string, enum: [news, editorial] } }
        - { name: q, in: query, description: Search in title, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of post summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminPostSummary' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin / Posts]
      summary: Create a post
      description: |
        Roles: author (drafts only), editor, admin.

        * `content` is sanitised (scripts, event handlers, `javascript:` links removed) and `readMinutes` is computed.
        * Without `slug`, one is generated from the title (Bangla kept) and de-duplicated; an explicit duplicate `slug` returns 409.
        * `status: scheduled` needs a future `publishedAt`; the post goes live automatically.
        * Category and tags must be in the same language as the post.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/AdminPost' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/posts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
