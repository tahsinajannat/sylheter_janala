  # ───────────────────────── Admin: media ─────────────────────────
  /admin/stats:
    get:
      tags: [Admin / Dashboard]
      summary: Dashboard numbers
      description: 'Roles: author (own content only), editor, admin. Counts by status, views today / 7 / 30 days, a 14-day series, top stories, pending comments and subscribers by status.'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      posts: { type: object, additionalProperties: { type: integer } }
                      photoCards: { type: object, additionalProperties: { type: integer } }
                      videos: { type: object, additionalProperties: { type: integer } }
                      views:
                        type: object
                        properties: { today: { type: integer }, week: { type: integer }, month: { type: integer } }
                      viewsByDay:
                        type: array
                        items:
                          type: object
                          properties: { day: { type: string, format: date }, views: { type: integer } }
                      topPosts: { type: array, items: { type: object } }
                      pendingComments: { type: integer }
                      subscribers: { type: object, additionalProperties: { type: integer } }
                      recentPosts: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/media:
    get:
      tags: [Admin / Media]
      summary: List uploaded images
      description: 'Roles: any staff.'
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of images
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Media' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin / Media]
      summary: Upload an image (Cloudinary)
      description: |
        Roles: any staff. `multipart/form-data`, field **`file`**.
        Maximum **10 MB** (strictly less than 10 485 760 bytes); JPEG, PNG, WebP, GIF or AVIF only.
        Returns `503` when Cloudinary is not configured, `413` when too large, `415` for other file types.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt: { type: string, maxLength: 250 }
                caption: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Media' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: File larger than 10 MB, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Not an allowed image type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Cloudinary is not configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

