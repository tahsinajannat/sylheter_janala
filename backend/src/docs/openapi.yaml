      summary: Get a post (with full content)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/AdminPost' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
